<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Editor Artikel</title>

<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>

<style>
body{
font-family:Arial;
max-width:1100px;
margin:auto;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Editor Artikel</h1>

<input id="title" placeholder="Judul Artikel">

<textarea id="editor"></textarea>

<br><br>

<button onclick="publish()">
Publish
</button>

<script>

tinymce.init({
selector:"#editor",
height:650,
menubar:true,
plugins:"lists link table image code media fullscreen searchreplace wordcount autosave preview",
toolbar:"undo redo | styles | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image media table | code preview fullscreen"
});

</script>

<script src="js/github-sync.js"></script>

<script>

async function publish(){

const data={
title:title.value,
slug:title.value.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,""),
content:tinymce.get("editor").getContent(),
created:new Date().toISOString()
};

saveGithub([data]);

}

</script>

</body>
</html>
