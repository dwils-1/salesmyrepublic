<h1>Dashboard V3</h1>
<div id="stats"></div>
<script>
Promise.all([
fetch("../../data/articles.json").then(r=>r.json()),
fetch("../../data/faq.json").then(r=>r.json()),
fetch("../../data/promo.json").then(r=>r.json())
]).then(([a,f,p])=>{
stats.innerHTML=`
<h2>Artikel : ${a.length}</h2>
<h2>FAQ : ${f.length}</h2>
<h2>Promo : ${p.length}</h2>
`;
});
</script>
