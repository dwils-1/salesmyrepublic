<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SalesMyRepublic CMS</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:30px}
.box{background:#fff;padding:20px;border-radius:10px;max-width:900px}
input,textarea{width:100%;padding:10px;margin:6px 0}
button{padding:10px 18px}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{border:1px solid #ddd;padding:8px}
</style>
</head>
<body>

<div class="box">

<h2>SalesMyRepublic CMS</h2>

<input id="token" placeholder="GitHub Token">

<input id="title" placeholder="Judul">

<textarea id="content" rows="10"></textarea>

<button onclick="publish()">Publish</button>

<pre id="log"></pre>

<h3>Daftar Artikel</h3>

<table>

<thead>
<tr>
<th>Judul</th>
<th>Slug</th>
<th>Tanggal</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>

<script src="js/github.js"></script>

</body>
</html>
