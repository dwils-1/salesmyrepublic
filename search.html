<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pencarian SalesMyRepublic</title>
<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px}
input{width:100%;padding:12px;font-size:16px}
.item{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}
a{text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<h1>Pencarian</h1>

<input id="q" placeholder="Cari artikel, FAQ, promo...">

<div id="hasil"></div>

<script>
let data=[];

fetch("search.json?"+Date.now())
.then(r=>r.json())
.then(j=>data=j);

q.oninput=()=>{

let s=q.value.toLowerCase();

hasil.innerHTML="";

data.filter(x=>
JSON.stringify(x).toLowerCase().includes(s)
).forEach(x=>{

hasil.innerHTML+=`
<div class=item>
<a href="pages/${x.type}/${x.slug}.html">${x.title}</a>
<p>${x.description}</p>
</div>
`;

});

}
</script>

</body>
</html>
